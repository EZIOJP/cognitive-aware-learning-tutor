; CALT EEG — ESP32-S3 + BioAmp EXG Pill
; Docs: docs/firmware/EEG_ESP32.md

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:ensure_secrets.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; SD / SPI / WiFi / NTP come from Arduino-ESP32 core (no extra lib_deps)
monitor_filters = esp32_exception_decoder
